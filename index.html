<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>稼働状況 · Inaly Pulse</title>
<style>
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#f8f9fb; --text:#101828; --muted:#667085; --faint:#98a2b3;
  --line:#e6e8ee; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.04);
  --ok:#12a150; --warn:#d98e04; --ng:#e5484d; --idle:#98a2b3; --accent:#4f46e5;
  --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1117; --surface:#161b22; --surface-2:#1b2129; --text:#e6edf3; --muted:#9198a1; --faint:#6e7681;
    --line:#2a313b; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.25);
    --ok:#3fb96e; --warn:#e3a72f; --ng:#f0625f; --idle:#6e7681; --accent:#8b8cf8;
  }
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  background-image:radial-gradient(900px 360px at 50% -120px,color-mix(in srgb,var(--accent) 10%,transparent),transparent 70%);
  background-repeat:no-repeat}
main{max-width:980px;margin:0 auto;padding:28px 16px 72px}
[data-s=ok]{--c:var(--ok)} [data-s=warn]{--c:var(--warn)} [data-s=ng]{--c:var(--ng)} [data-s=idle]{--c:var(--idle)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,#06b6d4));display:grid;place-items:center;color:#fff}
.brand h1{font-size:18px;margin:0;letter-spacing:.01em}
.brand small{color:var(--muted);font-weight:400;margin-left:2px}
.nav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.nav button,.nav input{background:transparent;border:0;border-radius:8px;padding:6px 10px;min-height:34px}
.nav button:hover:not(:disabled){background:var(--surface-2)}
.nav button:disabled{opacity:.35;cursor:default}
.nav input{width:9.2em;text-align:center;color-scheme:light dark}
.nav .sep{width:1px;height:20px;background:var(--line)}
.nav .latest{font-size:13px;color:var(--accent);font-weight:600}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* hero */
.hero{position:relative;display:flex;align-items:center;gap:18px;padding:22px 24px;border-radius:20px;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 15%,var(--surface)),var(--surface) 70%);
  border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));box-shadow:var(--shadow)}
.orb{position:relative;flex:none;width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;line-height:1}
.orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);opacity:.35}
.hero[data-s=ok] .orb::after,.hero[data-s=ng] .orb::after{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.35);opacity:0}}
.hero h2{margin:0;font-size:20px;line-height:1.35}
.hero .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.hero .sub{margin:4px 0 0;color:var(--muted);font-size:13px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{color:var(--muted);font-size:12px}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}

h3.section{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:34px 4px 12px;display:flex;align-items:center;gap:8px}
h3.section .n{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:12px;color:var(--muted)}

/* monitor cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:flex-start;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:7px;flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.card-h .t{min-width:0;flex:1}
.name{font-weight:650;overflow-wrap:anywhere;line-height:1.4}
.target{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.chip{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px}
.pill{font-size:12px;font-weight:650;padding:2px 10px;border-radius:99px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.kv div{font-size:12px;color:var(--muted)}
.kv b{display:block;font-size:16px;color:var(--text);font-variant-numeric:tabular-nums;font-weight:650}
.bars{display:flex;gap:2px;height:30px;align-items:stretch}
.bars i{flex:1 1 0;min-width:2px;max-width:14px;border-radius:3px;background:var(--c);opacity:.9}
.bars i:hover{opacity:1;transform:scaleY(1.12)}
.axis{display:flex;justify-content:space-between;color:var(--faint);font-size:11px;margin-top:4px;font-variant-numeric:tabular-nums}
.spark{display:block;width:100%;height:36px;margin-top:10px}
.spark path.a{fill:color-mix(in srgb,var(--accent) 14%,transparent);stroke:none}
.spark path.l{fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.days{display:flex;gap:3px;margin-top:12px}
.days button{flex:1;height:14px;border:0;padding:0;border-radius:4px;background:var(--c);opacity:.85}
.days button[data-s=idle]{opacity:.35}
.days button[aria-current=true]{outline:2px solid var(--accent);outline-offset:1px;opacity:1}
.days button:hover{opacity:1}
.cap{display:flex;justify-content:space-between;color:var(--faint);font-size:11px;margin-top:4px}
details.more{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸";transition:transform .15s}
details.more[open] summary::before{transform:rotate(90deg)}
.tbl{margin-top:8px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 10px;border-top:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-weight:600;border-top:0}
td.i{white-space:normal;overflow-wrap:anywhere;color:var(--muted)}
td .b{color:var(--c);font-weight:650}

/* incidents */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.inc{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.inc:first-child{border-top:0}
.inc .t{font-weight:650;overflow-wrap:anywhere}
.inc .d{color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
.inc .e{grid-column:2/4;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.error{color:var(--ng)}

footer{margin-top:40px;color:var(--faint);font-size:12px;text-align:center}
details.raw{margin-top:18px;color:var(--muted);font-size:13px}
details.raw summary{cursor:pointer;width:max-content}
pre{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:320px;color:var(--text);font-size:12px}

.skel{height:150px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface));background-size:200% 100%;animation:sh 1.4s infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:720px){
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero{padding:18px}
  .hero h2{font-size:17px}
  .orb{width:44px;height:44px;font-size:22px}
  .inc{grid-template-columns:auto 1fr}
  .inc .d{grid-column:1/3;text-align:left}
  .inc .e{grid-column:1/3}
}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      </div>
      <h1>稼働状況<small>Inaly Pulse</small></h1>
    </div>
    <div class="nav" role="group" aria-label="日付の切り替え">
      <button id="prev" type="button" aria-label="前の日">‹</button>
      <input id="date" type="date" aria-label="日付(UTC)">
      <button id="next" type="button" aria-label="次の日">›</button>
      <span class="sep"></span>
      <button id="latest" class="latest" type="button">最新</button>
      <button id="reload" type="button" aria-label="更新" title="更新">
        <svg id="reloadIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>

  <section id="hero" class="hero" data-s="idle" aria-live="polite">
    <div class="orb" aria-hidden="true">…</div>
    <div><div class="eyebrow">読み込み中</div><h2>状態を取得しています…</h2></div>
  </section>

  <div id="stats" class="stats"></div>

  <h3 class="section">監視対象<span id="mcount" class="n">0</span></h3>
  <div id="monitors" class="grid"><div class="skel"></div><div class="skel"></div></div>

  <h3 class="section">障害・失敗の記録<span id="icount" class="n">0</span></h3>
  <div id="incidents" class="list"></div>

  <details class="raw">
    <summary>この日のJSON(デバッグ用)</summary>
    <pre id="raw"></pre>
  </details>
  <footer id="foot"></footer>
</main>

<script>
/* ========= 設定 =========
   GitHub Pages(https://<owner>.github.io/<repo>/)では、同じサイト内の
   data/history/YYYY/MM/DD.json を相対パスで読みます。
   それ以外(ファイルを直接開く・別ドメイン)の場合は raw.githubusercontent.com から読みます。
   baseUrl を文字列で指定すると、その接頭辞を優先します("" なら相対パス)。 */
const CONFIG = {
  owner: "LingXuan-Li",
  repo: "Inaly_Exp",
  branch: "main",
  baseUrl: null,
  configPath: "config/monitors.json",
  historyDir: "data/history",
  days: 14,          // 稼働率の履歴として表示する日数
  refreshSec: 60
};

(function resolveBase(){
  const m = location.hostname.match(/^(.+)\.github\.io$/);
  if (m) {
    CONFIG.owner = m[1];
    const seg = location.pathname.split("/").filter(Boolean)[0];
    if (seg && !seg.endsWith(".html")) CONFIG.repo = seg;
  }
  if (CONFIG.baseUrl == null) {
    const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    CONFIG.baseUrl = (m || local)
      ? ""
      : `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/`;
  }
})();

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const LABEL = { ok:"正常", warn:"一部低下", ng:"障害", idle:"データなし" };

/* ---------- 日付(履歴ファイルはUTC日付) ---------- */
const pad = n => String(n).padStart(2, "0");
const fmtDate = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
const parseDate = s => new Date(s + "T00:00:00Z");
const addDays = (s, n) => { const d = parseDate(s); d.setUTCDate(d.getUTCDate() + n); return fmtDate(d); };
const todayUTC = () => fmtDate(new Date());
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseDate(s));

/* ---------- 取得 ---------- */
async function getJSON(path, bust){
  const res = await fetch(CONFIG.baseUrl + path + (bust ? "?t=" + Date.now() : ""), { cache: bust ? "no-store" : "default" });
  if (!res.ok) { const e = new Error(res.status + " " + path); e.status = res.status; throw e; }
  return res.json();
}
const dayPath = ds => { const [y, m, d] = ds.split("-"); return `${CONFIG.historyDir}/${y}/${m}/${d}.json`; };
const dayCache = new Map();   // 日付 -> {checks, ...} | null(ファイルなし)
async function loadDay(ds, force){
  if (!force && dayCache.has(ds)) return dayCache.get(ds);
  try {
    const v = await getJSON(dayPath(ds), force);
    v.checks = Array.isArray(v.checks) ? v.checks : [];
    dayCache.set(ds, v);
    return v;
  } catch (e) {
    if (e.status === 404) { dayCache.set(ds, null); return null; }
    return { error: e.message, checks: [] };
  }
}
const hasData = v => v && !v.error;

/* ---------- 集計 ---------- */
const level = c => c.status === "success" ? (c.details && c.details.warning ? "warn" : "ok") : "ng";
const ms = c => typeof c.duration === "number" ? c.duration / 1e6 : null;
const time = v => new Date(v);
function groupByMonitor(checks){
  const map = new Map();
  for (const c of checks) { if (!map.has(c.monitor_id)) map.set(c.monitor_id, []); map.get(c.monitor_id).push(c); }
  for (const a of map.values()) a.sort((x, y) => time(x.started_at) - time(y.started_at));
  return map;
}
const uptime = list => list.length ? list.filter(c => level(c) !== "ng").length / list.length : null;
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

/* ---------- 表示ヘルパー ---------- */
function el(tag, cls, text, attrs){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
const hhmm = v => time(v).toLocaleTimeString("ja-JP", { hour:"2-digit", minute:"2-digit" });
const hhmmss = v => time(v).toLocaleTimeString("ja-JP", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
const fmtMs = v => v == null ? "—" : v < 1000 ? Math.round(v) + " ms" : (v / 1000).toFixed(2) + " 秒";
const pct = v => v == null ? "—" : (Math.floor(v * 1000) / 10).toFixed(1) + "%";
function ago(v){
  const m = Math.round((Date.now() - time(v)) / 60000);
  if (m < 1) return "たった今";
  if (m < 60) return m + "分前";
  if (m < 1440) return Math.round(m / 60) + "時間前";
  return Math.round(m / 1440) + "日前";
}
function info(c){
  if (c.error) return c.error;
  const d = c.details || {};
  if (c.type === "http" && d.status_code != null) return "HTTP " + d.status_code + (d.body_truncated ? "(本文は先頭1MiBまで)" : "");
  if (c.type === "dns" && Array.isArray(d.resolver_results)) {
    const ok = d.resolver_results.filter(r => !r.error).length;
    return `リゾルバ ${ok}/${d.resolver_results.length}`;
  }
  return "";
}

function sparkline(values){
  if (values.length < 2) return null;
  const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const pts = values.map((v, i) => [i / (values.length - 1) * 100, 30 - ((v - min) / span) * 26 - 2]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2)).join("");
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 100 32"); svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("class", "spark"); svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "応答時間の推移");
  const a = document.createElementNS(NS, "path"); a.setAttribute("class", "a"); a.setAttribute("d", line + "L100 32L0 32Z");
  const l = document.createElementNS(NS, "path"); l.setAttribute("class", "l"); l.setAttribute("d", line);
  svg.append(a, l);
  return svg;
}

/* ---------- 状態 ---------- */
const S = { selected: todayUTC(), cfg: new Map(), order: [], days: new Map(), error: null };
let busy = false;

function rangeDates(sel){
  const out = [];
  for (let i = CONFIG.days - 1; i >= 0; i--) out.push(addDays(sel, -i));
  return out;
}
async function loadAll(force){
  const today = todayUTC();
  const dates = rangeDates(S.selected);
  const res = await Promise.all(dates.map(ds => loadDay(ds, force && (ds >= today || ds === S.selected))));
  S.days = new Map(dates.map((ds, i) => [ds, res[i]]));
  S.error = S.days.get(S.selected)?.error || null;
}

/* ---------- 描画 ---------- */
function renderHero(day, groups){
  const h = $("hero");
  let s = "idle", title = "この日のデータはありません", sub = "対応する履歴ファイルがまだ作成されていません。", glyph = "–";
  const eyebrow = S.selected === todayUTC() ? "現在のステータス" : S.selected + " の最終ステータス";
  if (S.error) {
    title = "履歴を読み込めませんでした"; sub = S.error; glyph = "!"; s = "ng";
  } else if (hasData(day) && day.checks.length) {
    const lasts = [...groups.values()].map(a => level(a[a.length - 1]));
    const ng = lasts.filter(x => x === "ng").length, warn = lasts.filter(x => x === "warn").length;
    if (ng) { s = "ng"; title = `${ng}件のサービスで障害が発生しています`; glyph = "×"; }
    else if (warn) { s = "warn"; title = `${warn}件のサービスで一部のDNSリゾルバが応答していません`; glyph = "!"; }
    else { s = "ok"; title = "すべてのサービスが正常に稼働しています"; glyph = "✓"; }
    const last = day.checks.reduce((m, c) => time(c.finished_at || c.started_at) > m ? time(c.finished_at || c.started_at) : m, new Date(0));
    sub = `最終チェック ${hhmm(last)}(${ago(last)}) · ${groups.size}件を監視中`;
  }
  h.dataset.s = s;
  h.replaceChildren(el("div", "orb", glyph, { "aria-hidden": "true" }),
    (() => { const d = el("div"); d.append(el("div", "eyebrow", eyebrow), el("h2", null, title), el("p", "sub", sub)); return d; })());
}

function renderStats(day){
  const box = $("stats"); box.replaceChildren();
  if (!hasData(day) || !day.checks.length) return;
  const checks = day.checks;
  const fails = checks.filter(c => level(c) === "ng").length;
  const lat = avg(checks.filter(c => c.status === "success").map(ms).filter(v => v != null));
  const items = [
    ["稼働率", pct(uptime(checks)), ""],
    ["チェック回数", checks.length, "回"],
    ["失敗", fails, "回"],
    ["平均応答", lat == null ? "—" : lat < 1000 ? Math.round(lat) : (lat / 1000).toFixed(2), lat == null ? "" : lat < 1000 ? "ms" : "秒"]
  ];
  for (const [k, v, u] of items) {
    const c = el("div", "stat"); c.append(el("div", "k", k));
    const val = el("div", "v", String(v)); if (u) val.append(el("small", null, u));
    c.append(val); box.append(c);
  }
}

function monitorCard(id, list){
  const cfg = S.cfg.get(id) || {};
  const last = list[list.length - 1];
  const s = last ? level(last) : "idle";
  const card = el("article", "card", null, { "data-s": s });
  const head = el("div", "card-h");
  head.append(el("span", "dot"));
  const t = el("div", "t");
  const nm = el("div", "name", cfg.name || id);
  const type = cfg.type || (last && last.type);
  if (type) nm.append(el("span", "chip", type));
  t.append(nm);
  if (cfg.target) t.append(el("div", "target", cfg.target));
  head.append(t, el("span", "pill", LABEL[s]));
  card.append(head);

  const lats = list.filter(c => c.status === "success").map(ms).filter(v => v != null);
  const kv = el("div", "kv");
  for (const [k, v] of [["稼働率", pct(uptime(list))], ["平均応答", fmtMs(avg(lats))], ["チェック", list.length + "回"]]) {
    const d = el("div", null, k); d.append(el("b", null, v)); kv.append(d);
  }
  card.append(kv);

  if (list.length) {
    const bars = el("div", "bars", null, { role: "img", "aria-label": "チェック結果の推移" });
    for (const c of list) {
      const l = level(c);
      const b = el("i", null, null, { "data-s": l, title: `${hhmmss(c.started_at)} · ${LABEL[l]} · ${fmtMs(ms(c))}${c.error ? " · " + c.error : ""}` });
      bars.append(b);
    }
    card.append(bars);
    const ax = el("div", "axis"); ax.append(el("span", null, hhmm(list[0].started_at)), el("span", null, hhmm(last.started_at)));
    card.append(ax);
    const sp = sparkline(lats); if (sp) card.append(sp);
  }

  /* 過去N日の稼働率 */
  const days = el("div", "days", null, { role: "group", "aria-label": `過去${CONFIG.days}日の稼働率` });
  for (const [ds, v] of S.days) {
    const arr = hasData(v) ? v.checks.filter(c => c.monitor_id === id) : [];
    const u = uptime(arr);
    const lv = u == null ? "idle" : u === 1 ? "ok" : u >= 0.95 ? "warn" : "ng";
    const b = el("button", null, null, { type: "button", "data-s": lv, "aria-label": `${ds} ${u == null ? "データなし" : "稼働率 " + pct(u)}`,
      title: `${ds} · ${u == null ? "データなし" : "稼働率 " + pct(u) + "(" + arr.filter(c => level(c) !== "ng").length + "/" + arr.length + ")"}` });
    if (ds === S.selected) b.setAttribute("aria-current", "true");
    b.addEventListener("click", () => select(ds));
    days.append(b);
  }
  card.append(days);
  const cap = el("div", "cap"); cap.append(el("span", null, `${CONFIG.days}日前`), el("span", null, "選択日"));
  card.append(cap);

  /* 直近のチェック詳細 */
  if (list.length) {
    const det = el("details", "more"); det.append(el("summary", null, "チェック履歴を表示"));
    const wrap = el("div", "tbl"), tb = el("table");
    const hd = el("tr"); for (const h of ["時刻", "結果", "応答", "詳細"]) hd.append(el("th", null, h));
    tb.append(hd);
    for (const c of [...list].reverse()) {
      const l = level(c), tr = el("tr", null, null, { "data-s": l });
      const r = el("td"); r.append(el("span", "b", LABEL[l]));
      tr.append(el("td", null, hhmmss(c.started_at)), r, el("td", null, fmtMs(ms(c))), el("td", "i", info(c)));
      tb.append(tr);
    }
    wrap.append(tb); det.append(wrap); card.append(det);
  }
  return card;
}

function renderMonitors(day, groups){
  const box = $("monitors"); box.replaceChildren();
  $("mcount").textContent = hasData(day) ? groups.size : 0;
  if (!hasData(day) || !groups.size) {
    box.style.display = "block";
    box.append(el("div", "list empty", S.error ? "履歴ファイルを読み込めませんでした。" : "この日のチェック結果はまだありません。"));
    return;
  }
  box.style.display = "";
  const ids = [...new Set([...S.order, ...groups.keys()])].filter(id => groups.has(id));
  for (const id of ids) box.append(monitorCard(id, groups.get(id)));
}

function incidentRuns(groups){
  const runs = [];
  for (const [id, list] of groups) {
    let cur = null;
    list.forEach((c, i) => {
      if (level(c) === "ng") {
        if (!cur) cur = { id, start: c.started_at, count: 0, error: c.error, ongoing: false };
        cur.count++; cur.last = c.started_at; if (c.error) cur.error = c.error;
        if (i === list.length - 1) cur.ongoing = true;
      } else if (cur) { cur.end = c.started_at; runs.push(cur); cur = null; }
    });
    if (cur) runs.push(cur);
  }
  return runs.sort((a, b) => time(b.start) - time(a.start));
}
function renderIncidents(day, groups){
  const box = $("incidents"); box.replaceChildren();
  if (!hasData(day)) { $("icount").textContent = 0; box.append(el("div", "empty", "データがありません。")); return; }
  const runs = incidentRuns(groups);
  $("icount").textContent = runs.length;
  if (!runs.length) { box.append(el("div", "empty", "この日、失敗したチェックはありません。")); return; }
  for (const r of runs) {
    const row = el("div", "inc");
    const pill = el("span", "pill", r.ongoing ? "継続中" : "復旧済み", { "data-s": r.ongoing ? "ng" : "ok" });
    const name = (S.cfg.get(r.id) || {}).name || r.id;
    const span = hhmm(r.start) + (r.ongoing ? " 〜 継続中" : " 〜 " + hhmm(r.end)) + ` · ${r.count}回連続`;
    row.append(pill, el("span", "t", name), el("span", "d", span));
    if (r.error) row.append(el("span", "e", r.error));
    box.append(row);
  }
}

function render(){
  const day = S.days.get(S.selected);
  const groups = hasData(day) ? groupByMonitor(day.checks) : new Map();
  renderHero(day, groups);
  renderStats(day);
  renderMonitors(day, groups);
  renderIncidents(day, groups);
  $("raw").textContent = day ? JSON.stringify(day, null, 2) : "(なし)";
  $("date").value = S.selected;
  $("next").disabled = S.selected >= todayUTC();
  $("foot").textContent = `履歴は UTC の日付ごとのファイル(${dayPath(S.selected)})から読み込み、時刻は端末のタイムゾーンで表示しています。`;
  document.title = (S.error ? "取得失敗" : LABEL[$("hero").dataset.s]) + " · 稼働状況";
}

/* ---------- 操作 ---------- */
function setBusy(v){
  busy = v;
  $("reload").disabled = v;
  $("reloadIcon").classList.toggle("spin", v);
}
async function refresh(force){
  if (busy) return;
  setBusy(true);
  try { await loadAll(force); } finally { setBusy(false); }
  render();
}
async function select(ds){
  if (!isDate(ds)) return;
  const max = todayUTC();
  S.selected = ds > max ? max : ds;
  history.replaceState(null, "", "#" + S.selected);
  await refresh(false);
}
async function goLatest(){
  S.selected = todayUTC();
  history.replaceState(null, "", location.pathname + location.search);
  await refresh(true);
  /* 今日のファイルがまだ無ければ、直近で存在する日に移動する */
  if (!hasData(S.days.get(S.selected)) && !S.error) {
    const found = [...S.days.entries()].reverse().find(([, v]) => hasData(v));
    if (found) { S.selected = found[0]; await refresh(false); }
  }
}

async function loadConfig(){
  try {
    const cfg = await getJSON(CONFIG.configPath);
    const list = Array.isArray(cfg) ? cfg : (cfg.monitors || []);
    S.cfg = new Map(list.map(m => [m.id, m]));
    S.order = list.map(m => m.id);
  } catch { /* 設定が読めなくても履歴だけで表示できる */ }
}

$("prev").addEventListener("click", () => select(addDays(S.selected, -1)));
$("next").addEventListener("click", () => select(addDays(S.selected, 1)));
$("date").addEventListener("change", e => select(e.target.value));
$("latest").addEventListener("click", goLatest);
$("reload").addEventListener("click", () => refresh(true));
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (isDate(h) && h !== S.selected) select(h); });

(async function init(){
  $("date").max = todayUTC();
  await loadConfig();
  const h = location.hash.slice(1);
  if (isDate(h)) { S.selected = h; await refresh(true); }
  else await goLatest();
  setInterval(() => { if (!document.hidden && S.selected >= todayUTC()) refresh(true); }, CONFIG.refreshSec * 1000);
})();
</script>
