<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>稼働状況</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --text:#1c2430; --muted:#667085; --line:#e3e7ee;
  --ok:#1a9b57; --warn:#c98a00; --ng:#d6403a; --idle:#8a93a3;
  --ok-bg:#e6f5ec; --warn-bg:#fdf3dc; --ng-bg:#fbe7e6; --idle-bg:#eceef2;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12161c; --surface:#1a2029; --text:#e6e9ef; --muted:#9aa4b5; --line:#2a323f;
    --ok:#3dc47a; --warn:#e0a826; --ng:#ef6a64; --idle:#7d8799;
    --ok-bg:#16301f; --warn-bg:#352c10; --ng-bg:#3a1b1a; --idle-bg:#242b36;
  }
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:820px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:20px;margin:0 0 20px}
h2{font-size:16px;margin:36px 0 12px}
.banner{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.banner strong{font-size:17px}
.banner .sub{color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
.banner[data-s=ok]{background:var(--ok-bg);border-color:transparent}
.banner[data-s=warn]{background:var(--warn-bg);border-color:transparent}
.banner[data-s=ng]{background:var(--ng-bg);border-color:transparent}
.dot{width:12px;height:12px;border-radius:50%;background:var(--idle);flex:none}
[data-s=ok]>.dot,.dot[data-s=ok]{background:var(--ok)}
[data-s=warn]>.dot,.dot[data-s=warn]{background:var(--warn)}
[data-s=ng]>.dot,.dot[data-s=ng]{background:var(--ng)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.name{font-weight:600;overflow-wrap:anywhere}
.target{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.badge{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.badge[data-s=ok]{background:var(--ok-bg);color:var(--ok)}
.badge[data-s=warn]{background:var(--warn-bg);color:var(--warn)}
.badge[data-s=ng]{background:var(--ng-bg);color:var(--ng)}
.badge[data-s=idle]{background:var(--idle-bg);color:var(--muted)}
.meta{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:13px}
.msg{grid-column:2 / 4;font-size:13px;color:var(--ng);overflow-wrap:anywhere}
.empty,.error{padding:20px 18px;color:var(--muted)}
.error{color:var(--ng)}
.inc{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.inc:first-child{border-top:0}
.inc .t{font-weight:600}
.inc .d{color:var(--muted);font-size:13px;margin-left:auto}
details{margin-top:36px;color:var(--muted);font-size:13px}
summary{cursor:pointer}
pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;max-height:320px;color:var(--text)}
button{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 12px;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 id="title">稼働状況</h1>
    <button id="reload" type="button">更新</button>
  </div>
  <div id="banner" class="banner"><span class="dot"></span><strong>読み込み中…</strong></div>

  <h2>監視対象</h2>
  <div id="monitors" class="list"></div>

  <h2>障害履歴</h2>
  <div id="incidents" class="list"></div>

  <details>
    <summary>読み込んだJSON(デバッグ用)</summary>
    <pre id="raw"></pre>
  </details>
</main>

<script>
/* ========= 設定 =========
   GitHub Pages(https://<owner>.github.io/<repo>/)で公開する場合は自動判定されます。
   独自ドメインなどで判定できない場合だけ、下の値を書き換えてください。 */
const CONFIG = {
  owner: "LingXuan-Li",
  repo: "Inaly_Exp",
  branch: "main",
  configPath: "config/monitors.json",
  statePath: "data/state/monitor_states.json",
  incidentsDir: "data/incidents",
  incidentLimit: 20,
  refreshSec: 60
};

(function detectRepo(){
  const m = location.hostname.match(/^(.+)\.github\.io$/);
  if (m) {
    CONFIG.owner = m[1];
    const seg = location.pathname.split("/").filter(Boolean)[0];
    if (seg && !seg.endsWith(".html")) CONFIG.repo = seg;
  }
})();

const $ = id => document.getElementById(id);
const raw = {};

/* ---------- 取得 ---------- */
async function getJSON(url){
  const res = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error(res.status + " " + url);
  return res.json();
}

/* ---------- 形式の揺れを吸収 ---------- */
function toList(data){
  if (Array.isArray(data)) return data;
  if (!data || typeof data !== "object") return [];
  for (const k of ["monitors","states","items","incidents","data"]) {
    if (data[k]) return toList(data[k]);
  }
  const vals = Object.entries(data).filter(([,v]) => v && typeof v === "object" && !Array.isArray(v));
  if (vals.length && vals.length === Object.keys(data).length) {
    return vals.map(([k,v]) => ({ id: k, ...v }));
  }
  return [];
}
const pick = (o, keys) => { for (const k of keys) if (o && o[k] != null && o[k] !== "") return o[k]; return undefined; };

function statusGroup(v){
  const s = String(v ?? "").toLowerCase();
  if (/(outage|down|fail|error|critical|ng|open)/.test(s)) return "ng";
  if (/(degrad|slow|warn|partial)/.test(s)) return "warn";
  if (/(up|ok|operational|success|healthy|resolved|normal)/.test(s)) return "ok";
  return "idle";
}
const LABEL = { ok:"正常", warn:"低下", ng:"停止", idle:"不明" };

function normalizeMonitor(s, cfgMap){
  const id = pick(s, ["id","monitor_id","monitorId"]);
  const c = cfgMap.get(id) || {};
  let st = pick(s, ["status","state","current_status","health"]);
  let group = statusGroup(st);
  if (s.paused || /pause/i.test(String(st))) { group = "idle"; st = "paused"; }
  if (/maint/i.test(String(st))) { group = "idle"; }
  const label = /pause/i.test(String(st)) ? "一時停止" : /maint/i.test(String(st)) ? "メンテナンス" : LABEL[group];
  return {
    id,
    name: pick(c, ["name","title"]) || pick(s, ["name","title"]) || id || "(名前なし)",
    target: pick(c, ["target","url","host"]) || pick(s, ["target","url","host"]) || "",
    group, label,
    checked: pick(s, ["last_checked_at","last_check_at","checked_at","last_run_at","updated_at","timestamp"]),
    latency: pick(s, ["latency_ms","last_latency_ms","latency","response_time_ms"]),
    failures: pick(s, ["consecutive_failures","failure_count","failures"]),
    message: pick(s, ["message","detail","details","error","last_error"])
  };
}

/* ---------- 表示 ---------- */
function fmtTime(v){
  if (v == null) return "—";
  const d = new Date(typeof v === "number" && v < 1e12 ? v * 1000 : v);
  return isNaN(d) ? String(v) : d.toLocaleString("ja-JP", { dateStyle:"short", timeStyle:"medium" });
}
function ago(v){
  const d = new Date(typeof v === "number" && v < 1e12 ? v * 1000 : v);
  if (isNaN(d)) return "";
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "たった今";
  if (m < 60) return m + "分前";
  if (m < 1440) return Math.round(m / 60) + "時間前";
  return Math.round(m / 1440) + "日前";
}
function el(tag, cls, text, attrs){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function renderMonitors(list){
  const box = $("monitors"); box.replaceChildren();
  if (!list.length) { box.append(el("div","empty","監視データがまだありません。Actionsの「Inaly Pulse」を手動実行してください。")); return; }
  for (const m of list) {
    const row = el("div","row");
    row.append(el("span","dot",null,{ "data-s": m.group }));
    const head = el("div"); head.append(el("div","name",m.name));
    if (m.target) head.append(el("div","target",m.target));
    row.append(head, el("span","badge",m.label,{ "data-s": m.group }));
    const meta = el("div","meta");
    meta.append(el("span",null,"最終確認 " + fmtTime(m.checked) + (m.checked ? "(" + ago(m.checked) + ")" : "")));
    if (m.latency != null) meta.append(el("span",null,"応答 " + m.latency + " ms"));
    if (m.failures) meta.append(el("span",null,"連続失敗 " + m.failures + "回"));
    row.append(meta);
    if (m.message && m.group !== "ok") row.append(el("div","msg",typeof m.message === "string" ? m.message : JSON.stringify(m.message)));
    box.append(row);
  }
}

function renderBanner(list, failed){
  const b = $("banner"); b.replaceChildren(el("span","dot"));
  let s = "idle", text = "状態を取得できません";
  if (!failed && list.length) {
    const ng = list.filter(m => m.group === "ng").length;
    const warn = list.filter(m => m.group === "warn").length;
    if (ng) { s = "ng"; text = ng + "件のサービスで障害が発生しています"; }
    else if (warn) { s = "warn"; text = warn + "件のサービスで応答が低下しています"; }
    else if (list.every(m => m.group === "idle")) { s = "idle"; text = "状態の確認待ちです"; }
    else { s = "ok"; text = "すべてのサービスが正常に稼働しています"; }
  }
  b.dataset.s = s;
  b.append(el("strong",null,text), el("span","sub","更新 " + new Date().toLocaleTimeString("ja-JP")));
}

function renderIncidents(list, note){
  const box = $("incidents"); box.replaceChildren();
  if (note) { box.append(el("div","empty",note)); return; }
  if (!list.length) { box.append(el("div","empty","記録された障害はありません。")); return; }
  for (const i of list) {
    const row = el("div","inc");
    const open = statusGroup(pick(i, ["status","state"])) === "ng";
    row.append(el("span","badge", open ? "対応中" : "解決済み", { "data-s": open ? "ng" : "ok" }));
    row.append(el("span","t", pick(i, ["title","name","monitor_name","monitor_id","id"]) || "障害"));
    const start = pick(i, ["started_at","opened_at","created_at","start"]);
    const end = pick(i, ["resolved_at","closed_at","ended_at"]);
    row.append(el("span","d", fmtTime(start) + (end ? " 〜 " + fmtTime(end) : "")));
    box.append(row);
  }
}

/* ---------- 障害履歴(GitHub APIでフォルダ一覧を取得) ---------- */
async function loadIncidents(){
  const api = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.incidentsDir}?ref=${CONFIG.branch}`;
  const res = await fetch(api);
  if (res.status === 404) return { list: [] };
  if (!res.ok) throw new Error("incidents " + res.status);
  const files = (await res.json()).filter(f => f.type === "file" && f.name.endsWith(".json"))
    .sort((a,b) => b.name.localeCompare(a.name)).slice(0, CONFIG.incidentLimit);
  const list = [];
  for (const f of files) {
    try {
      const data = await getJSON(f.download_url);
      const items = toList(data);
      if (items.length) list.push(...items);
      else if (data && typeof data === "object") list.push(data);
    } catch {}
  }
  return { list };
}

/* ---------- メイン ---------- */
async function load(){
  $("reload").disabled = true;
  let monitors = [], failed = false;
  try {
    let cfgMap = new Map();
    try {
      raw.config = await getJSON(CONFIG.configPath);
      cfgMap = new Map(toList(raw.config).map(c => [c.id, c]));
    } catch {}
    raw.state = await getJSON(CONFIG.statePath);
    monitors = toList(raw.state).map(s => normalizeMonitor(s, cfgMap));
    if (!monitors.length && cfgMap.size) {
      monitors = [...cfgMap.values()].map(c => normalizeMonitor({ id: c.id }, cfgMap));
    }
    renderMonitors(monitors);
  } catch (e) {
    failed = true;
    const box = $("monitors"); box.replaceChildren(el("div","error","状態ファイルを読み込めませんでした: " + e.message));
  }
  renderBanner(monitors, failed);

  try {
    const { list } = await loadIncidents();
    raw.incidents = list;
    renderIncidents(list.sort((a,b) => String(pick(b,["started_at","opened_at","created_at"])).localeCompare(String(pick(a,["started_at","opened_at","created_at"])))));
  } catch (e) {
    renderIncidents([], "障害履歴を取得できませんでした(" + e.message + ")。");
  }
  $("raw").textContent = JSON.stringify(raw, null, 2);
  $("reload").disabled = false;
}

$("reload").addEventListener("click", load);
load();
setInterval(load, CONFIG.refreshSec * 1000);
</script>
</body>
</html>
