name: Inaly Pulse

on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run enabled monitors even if their interval has not elapsed
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  monitor:
    uses: LingXuan-Li/inaly_pulse/.github/workflows/monitor.yml@main
    with:
      app_id: ${{ vars.INALY_APP_ID }}
      # schedule 実行では inputs が空になり、boolean入力に空値が渡るのを避ける
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
    secrets:
      INALY_APP_PRIVATE_KEY: ${{ secrets.INALY_APP_PRIVATE_KEY }}
      INALY_MONITOR_SECRETS: ${{ secrets.INALY_MONITOR_SECRETS }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
