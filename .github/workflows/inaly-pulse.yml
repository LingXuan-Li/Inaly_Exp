name: Inaly Pulse

run-name: Inaly Pulse

on:
  push:
    branches:
      - main

  schedule:
    - cron: "13,43 * * * *"

  workflow_dispatch:
    inputs:
      force:
        description: "Run enabled monitors even if their interval has not elapsed"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: inaly-pulse
  cancel-in-progress: false

jobs:
  monitor:
    uses: LingXuan-Li/inaly_pulse/.github/workflows/monitor.yml@main

    with:
      app_id: ${{ vars.INALY_APP_ID }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}

    secrets:
      INALY_APP_PRIVATE_KEY: ${{ secrets.INALY_APP_PRIVATE_KEY }}
      INALY_MONITOR_SECRETS: ${{ secrets.INALY_MONITOR_SECRETS }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  deploy:
    # monitor が成功した場合のみ実行（needs のデフォルト動作）
    needs: monitor

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout (latest main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r config data _site/

      - name: Check build output
        run: |
          echo "Checking site files..."
          ls -la _site
          test -f _site/index.html
          test -d _site/config
          test -d _site/data

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
